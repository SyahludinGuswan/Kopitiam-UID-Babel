publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0
  http: ^1.5.0
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
