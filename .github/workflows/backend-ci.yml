name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "kopitiam_backend/**"
      - "kopitiam_auth/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "kopitiam_backend/**"
      - pull_request.paths
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  syntax-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kopitiam_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kopitiam_backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check
      - name: Backend regression tests
        run: npm test
